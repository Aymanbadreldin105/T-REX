	<!DOCTYPE html>
	<html>
	<head>
		<title>T-REX runner</title>
		<style type="text/css">
			*{
				padding: 0;
				margin:0;
				box-sizing: border-box;
				  overflow: hidden;
			} 
@keyframes slideright{
	from{
		background-position:7000%; 
	}
	to{
		background-position: 0%;
	}
}
.desert{
	position: absolute;
	background-image:linear-gradient(to right, red , yellow);
	bottom: 0;
	height: 200px;
	width: 100%;
	animation: slideright 600s infinite linear;
}
.dino{
	position: absolute;
	background-image:url("https://trex-runner.com/img/night.png");
	background-size: cover;
	bottom: 0;
	height: 60px;
	width: 60px;
}
.obstacle{
	
	position: absolute;
	background-color:#ccc;
	bottom: 0px;
	height: 60px;
	width: 60px;
}
}
		</style>
	</head>
	<body>
<button onclick="restartGame()">reset</button>
	<div class="desert">
		<h2 class="header"></h2>
		<div class="grid">
			<div class="dino"></div>
			 
		</div>
	</div> 
</div>

	  const boomSound = new Audio("https://opengameart.org/sites/default/files/boom5.mp3");

	function control(e){
		if (e.code === "Space"){
			if (!isjumping) {
				jump();
				playJumpSound()
			}
		}
	}
	function jump(){
		isjumping = true
		let count = 0
		let timerId = setInterval(function () {
				//move down
		if (count === 15) {
			clearInterval(timerId)
			let downTimerId=setInterval(function(){
			if(count === 0){
				clearInterval(downTimerId)
				isjumping = false
				
			}
            position-=5
			count--
			position = position * gravity 
			dino.style.bottom = position +'px'
			},20)
		}
			//move up
			position+=30
			count++
			position = position * gravity 
			dino.style.bottom = position +'px'
		},20)
	         }
	
	function geneateObstacles(){
		if (!isGameOver) {
			
			let obstaclePosition =1000
		const obstacle = document.createElement("div")
		obstacle.classList.add("obstacle")
		grid.appendChild(obstacle)
		obstacle.style.left = obstaclePosition +'px'
		
		 timerId = setInterval(function(){
		 	obstaclePosition-=10
		    obstacle.style.left = obstaclePosition +'px'
			if (obstaclePosition > 0 && obstaclePosition < 60 && position < 60 ) {
				alert.innerHTML = 'Game Over'
				clearInterval(timerId)
				isGameOver=true
				playSound();
				//remove all chlidren
				const children = grid.querySelectorAll("*");
			    children.forEach(child => {
			      if (!child.classList.contains("dino")) {
			      child.remove();
	  }
	});
			}
			
		},20)
		 generateTimeoutId = setTimeout(geneateObstacles, randomTime)
		}
		
	}
	function restartGame() {
	// أوقف المؤقتات السابقة
	clearInterval(timerId);
	clearTimeout(generateTimeoutId);

	position = 0;
	isjumping = false;
	isGameOver = false;
	alert.innerHTML = "";

	const children = grid.querySelectorAll("*");
	children.forEach(child => {
		if (!child.classList.contains("dino")) {
			child.remove();
		}
	});

	randomTime = Math.random() * 4000;
	geneateObstacles();
} 
	geneateObstacles()
	document.addEventListener('keydown',control)  
function playSound() {
   		 boomSound.currentTime = 0; // يعيد الصوت من البداية كل مرة
       boomSound.play();
  }
    function playJumpSound() {
   		 jumpSound.currentTime = 0; // يعيد الصوت من البداية كل مرة
       jumpSound.play();
  }
